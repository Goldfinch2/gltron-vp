# GLtron: its lamp colors and its control guide, for a cabinet with LED-lit
# controls (the cabinet's own leds.cfg wins where it has lines for gltron).
# See the VectorPie SDK's docs/07-packages.md.

gltron/color_map[p1_joystick1] #00C0FF
gltron/color_map[p1_button1]   #FF8000
gltron/color_map[p1_button2]   #C000FF
gltron/color_map[p2_joystick1] #00C0FF
gltron/color_map[p2_button1]   #FF8000
gltron/color_map[p2_button2]   #C000FF

# both players' controls light together for each step
gltron/voice_map[p1_joystick1] steer
gltron/voice_map[p2_joystick1] steer
gltron/voice_map[p1_button1]   booster
gltron/voice_map[p2_button1]   booster
gltron/voice_map[p1_button2]   wall_buster
gltron/voice_map[p2_button2]   wall_buster
